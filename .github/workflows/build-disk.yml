---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - 'disk_config/**'
      - '.github/workflows/build-disk.yml'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  # Was pinned to ghcr.io/lorbuschris/bootc-image-builder:20250608 for
  # https://github.com/osbuild/bootc-image-builder/pull/954; that image now
  # returns 403 and cannot be pulled, so track upstream.
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # inputs.platform exists only for workflow_dispatch. On pull_request it
    # is empty, so this has to default to amd64: the previous form tested
    # == 'amd64' and fell through to the arm64 runner on every PR, where
    # bootc-image-builder cannot create a container from this amd64-only
    # image and reports "no such container".
    runs-on: ${{ inputs.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          # Absolute path on purpose. The action passes this straight to
          # `podman --volume <path>:/config.toml`, and podman reads a bare
          # relative path as a volume NAME rather than a host path, failing
          # with "names must match [a-zA-Z0-9]" because of the slash.
          config-file: ${{ github.workspace }}/disk_config/${{ matrix.disk-type == 'anaconda-iso' && 'iso.toml' || 'disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          # --rootfs is required: without it BIB tries to derive the rootfs
          # type by mounting the image, and fails that path with a
          # misleading "no such container". The Justfile has always passed
          # it; CI did not, which is why local builds worked and this did
          # not the first time it ran.
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true && github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v4
        with:
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
      
      - name: Upload to S3
        if: inputs.upload-to-s3 == true && github.event_name != 'pull_request'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy $SOURCE_DIR S3:${{ secrets.S3_BUCKET_NAME }}

      - name: Diagnose build failure
        if: failure()
        run: |
          echo "::group::AppArmor state"
          sudo aa-status --json 2>/dev/null | head -c 2000 || sudo aa-status | head -20 || true
          echo "::endgroup::"
          echo "::group::Kernel denials"
          sudo dmesg | grep -iE 'apparmor|audit|denied' | tail -40 || true
          echo "::endgroup::"
          echo "::group::storage backing"
          df -hT /var/lib/containers/storage 2>/dev/null || true
          findmnt -no FSTYPE,SOURCE,TARGET /var/lib/containers/storage 2>/dev/null || true
          stat -f -c 'fstype=%T' /var/lib/containers/storage 2>/dev/null || true
          uname -r
          echo "::endgroup::"
          echo "::group::podman"
          podman version; sudo podman info --format '{{.Host.Security}}' || true
          echo "::endgroup::"
